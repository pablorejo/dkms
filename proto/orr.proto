syntax = "proto3";

package dkms.orr.v1;

import "common.proto";

// ORR = Onion Routing Router.
//
// Sits between DKMS (upper layer) and QKC (lower transport). Two surfaces:
//
//   * Higher-layer plumbing (SendMessage / StreamDeliveries) — what the DKMS
//     or any other client uses to push payloads through the QKD substrate
//     and receive messages that arrive for this node.
//
//   * Onion circuit lifecycle (OpenCircuit / CloseCircuit / Relay …) — the
//     per-hop PQC handshakes and onion peeling used when `max_hops != 0`.
//     With `max_hops == 0` the ORR is a thin pass-through to QKC and these
//     circuit RPCs are unused.
service OrrControl {
  // ── higher-layer surface ────────────────────────────────────────────
  // High-level send: DKMS (or any client) asks this ORR to relay
  // `payload` to the destination ORR. `max_hops` controls the routing
  // mode (0 = QKC passthrough, 1 = PQC E2E, -1 / >=2 = onion).
  rpc SendMessage      (SendMessageRequest)      returns (SendMessageResponse);

  // Subscribe to messages delivered locally to this ORR. Each message
  // is what arrived from the QKC plus the ORR-level header.
  rpc StreamDeliveries (StreamDeliveriesRequest) returns (stream DeliveredMessage);

  // Devuelve la pubkey ML-KEM de este ORR. La usan los peers al
  // arrancar para construir su `peer_pubkeys` registry sin tener que
  // pegar la clave en TOML (que se regenera cada boot).
  rpc GetPublicKey     (GetPublicKeyRequest)     returns (GetPublicKeyResponse);

  // Bootstrap inicial del `bootstrap_secret` de 32 B con el peer. El
  // initiator hace `kem.encap(peer.long_term_pubkey)` y manda el
  // ciphertext; el receptor decapsula con su sk long-term y obtiene el
  // mismo `shared_secret`. Ambos lados lo guardan en
  // `bootstrap_secrets[peer_orr_id]` y NO lo usan jamás como keystream.
  //
  // El `bootstrap_secret` sirve solo como **clave HMAC** para autenticar
  // las RPCs de rotación (`RequestEphemeralKey` /
  // `EstablishEphemeralSecret`); el `master_secret` real por época nace
  // de cada rotación con una keypair ML-KEM efímera nueva. Esto provee
  // forward secrecy (audit H-3): capturar la `long_term_sk` en el futuro
  // junto con tráfico grabado pasado NO permite descifrar tráfico de
  // épocas pasadas, porque la esk efímera del responder se zeroiza tras
  // decap exitosa.
  //
  // Tras éxito de `EstablishSecret`, el initiator dispara
  // inmediatamente la primera rotación (`epoch_id = 1`) para poblar
  // `master_secrets[peer][1]`.
  rpc EstablishSecret  (EstablishSecretRequest)  returns (EstablishSecretResponse);

  // ── ORR Option-B forward secrecy: rotación de master_secret ─────────
  // Sub-protocolo HMAC-autenticado que rota el `master_secret` por
  // época. Lex-smaller `orr_id` inicia; el otro lado es reactivo
  // (handlers). Cada rotación reemplaza `master_secrets[peer][N]` por
  // `master_secrets[peer][N+1]` y zeroiza la esk efímera del responder
  // tras decap exitosa. Ver `orr/src/rotation.rs` para detalles.
  //
  // Paso 1: A → B `RequestEphemeralKey(epoch)`. B valida MAC, genera
  // `(epk, esk)` ML-KEM-768 frescos, guarda esk en
  // `ephemeral_sks[A][epoch]`, devuelve epk + MAC.
  rpc RequestEphemeralKey      (RequestEphemeralKeyRequest)
      returns (RequestEphemeralKeyResponse);

  // Paso 2: A valida MAC del paso 1, `encap(epk) → (ct, ss)`, guarda
  // `master_secrets[B][epoch] = ss`, manda `EstablishEphemeralSecret`.
  // B valida MAC, `decap(esk, ct) → ss`, guarda
  // `master_secrets[A][epoch] = ss`, ZEROIZA `ephemeral_sks[A][epoch]`.
  // FS boundary: tras este punto, ninguna sk efímera persiste.
  rpc EstablishEphemeralSecret (EstablishEphemeralSecretRequest)
      returns (EstablishEphemeralSecretResponse);

  // ── onion-circuit surface (max_hops != 0) ───────────────────────────
  // Open a new onion circuit toward a destination. SDN computes the path,
  // DKMS calls this to bring the circuit up.
  rpc OpenCircuit  (OpenCircuitRequest)  returns (OpenCircuitResponse);

  // Tear down a circuit.
  rpc CloseCircuit (CloseCircuitRequest) returns (.dkms.common.v1.Status);

  // Health/status of a circuit.
  rpc GetCircuit   (GetCircuitRequest)   returns (Circuit);

  // List active circuits.
  rpc ListCircuits (ListCircuitsRequest) returns (stream Circuit);

  // Forward an onion-wrapped frame one hop further (called by the previous
  // hop). The terminal hop hands off to the local QKC/DKMS.
  rpc Relay        (RelayFrame)          returns (.dkms.common.v1.Status);
}

// ── higher-layer messages ─────────────────────────────────────────────

message SendMessageRequest {
  // Destination ORR id (logical, opaque string).
  .dkms.common.v1.NodeId destination = 1;
  // Application payload — opaque bytes for the ORR.
  bytes payload                     = 2;
  // Routing mode (see ORR docstring). Defaults to 0 (passthrough) when
  // `has_max_hops` is false.
  int32 max_hops                    = 3;
  bool  has_max_hops                = 4;
  // Application-level header attached to the message (passed back to the
  // delivery subscriber on arrival).
  map<string, string> app_header    = 5;
  // Fire-and-forget: don't wait for the QKC ACK before returning.
  bool fire_and_forget              = 6;
  // Key grade for the relayed frame: 0 = QKD-grade (default), 1 = PQC-grade.
  // The ORR writes it into the wire frame's RESERVED byte so the QKC routes
  // the key over the grade-appropriate path (QKD-only vs full). See
  // wire::GRADE_QKD / GRADE_PQC.
  uint32 grade                      = 7;
}

message SendMessageResponse {
  string status                       = 1;   // "sent" | "delivered_local"
  .dkms.common.v1.NodeId final_destination = 2;
  uint32 next_hop_qkc                 = 3;
  int32  remaining_hops               = 4;
  bool   pqc_layer                    = 5;
}

message StreamDeliveriesRequest {
  // Free-form subscriber identifier (logged for debugging — multiple
  // subscribers are allowed and each gets its own copy of every
  // delivery).
  string subscriber_id = 1;
}

message GetPublicKeyRequest {}

message GetPublicKeyResponse {
  bytes  public_key = 1;   // raw ML-KEM pubkey bytes (ej. 1184 B para ml-kem-768)
  string suite      = 2;   // nombre de la suite, p.ej. "ml-kem-768"
  .dkms.common.v1.NodeId orr_id = 3;
  // Firma ML-DSA (FIPS 204) sobre (orr_id ‖ suite ‖ public_key) con la
  // identidad de firma estable del ORR (docs/SECURITY.md §Fase 6 PQC). Vacía
  // si el ORR no tiene `sign_secret_seed`. El peer la verifica con la
  // `peer_verify_keys[orr_id]` configurada — cierra el MITM sobre GetPublicKey
  // sin necesidad de persistir la identidad ML-KEM (que sigue siendo efímera).
  bytes  signature  = 4;
}

message EstablishSecretRequest {
  // ORR id del initiator (quien hizo encap). El receptor lo guarda como
  // clave en `master_secrets[from]`. Va en cleartext porque es lo que
  // permite identificar de qué peer es el master_secret.
  .dkms.common.v1.NodeId from = 1;
  // ML-KEM ciphertext del encap. El receptor lo decapsula con su sk y
  // obtiene el shared_secret de 32 B.
  bytes ciphertext            = 2;
}

message EstablishSecretResponse {
  // Confirmación. `false` si el decap falló (clave incorrecta, suite
  // mismatch...) — el initiator deberá reintentar tras backoff.
  bool ok                    = 1;
  // Si ok=false, descripción para logs.
  string error               = 2;
}

// ── ORR Option-B rotation messages ────────────────────────────────────
//
// Todas las MACs son HMAC-SHA256 con `bootstrap_secrets[peer]` como
// clave, sobre un input dominio-separado:
//
//   - REQ:  "REQ"||epoch_id_be||from||peer
//   - RESP: "RESP"||epoch_id_be||from||peer||ephemeral_pubkey
//   - FIN:  "FIN"||epoch_id_be||from||peer||ciphertext
//
// Se verifican con `Mac::verify_slice` (constant-time). `epoch_id_be`
// es el `epoch_id` u32 en big-endian (mismo encoding que el wire,
// ver `wire/src/lib.rs`).

message RequestEphemeralKeyRequest {
  // ORR initiator (lex-smaller `orr_id`). El receptor lo guarda
  // implícitamente vía `ephemeral_sks[from][epoch_id]`.
  .dkms.common.v1.NodeId from = 1;
  // ORR responder (= self del receptor). Se incluye en el input HMAC
  // para que un MAC válido para par `(A,B)` no sea reutilizable en
  // par `(A,C)`.
  .dkms.common.v1.NodeId peer = 2;
  // Identificador monotónicamente creciente de la época que se está
  // negociando. El initiator elige `current_send_epoch[peer] + 1`.
  uint32 epoch_id             = 3;
  // HMAC-SHA256(bootstrap_secrets[peer],
  //   "REQ" || epoch_id_be || from || peer).
  bytes  mac                  = 4;
}

message RequestEphemeralKeyResponse {
  // `false` si el MAC falló (no se mutó estado en el receptor).
  bool   ok               = 1;
  // Descripción del fallo si `ok = false`.
  string error            = 2;
  // Pubkey ML-KEM-768 fresca del responder, generada para esta época.
  // El initiator hará `encap(ephemeral_pubkey)` para producir el
  // shared_secret de esta época. Sólo se rellena si `ok = true`.
  bytes  ephemeral_pubkey = 3;
  // HMAC-SHA256(bootstrap_secrets[from],
  //   "RESP" || epoch_id_be || from || peer || ephemeral_pubkey).
  // `from`/`peer` son los mismos del request (no se reflejan aquí
  // porque la sesión gRPC los conoce). Sólo se rellena si `ok = true`.
  bytes  mac              = 4;
}

message EstablishEphemeralSecretRequest {
  // Initiator (mismo que `RequestEphemeralKeyRequest.from`).
  .dkms.common.v1.NodeId from = 1;
  // Responder (mismo que `RequestEphemeralKeyRequest.peer`).
  .dkms.common.v1.NodeId peer = 2;
  // Misma época que se negoció en el `RequestEphemeralKey` previo.
  uint32 epoch_id             = 3;
  // ML-KEM-768 ciphertext producido por
  // `encap(ephemeral_pubkey)` del paso 1. El responder lo decapsula
  // con la `esk` guardada en `ephemeral_sks[from][epoch_id]` y obtiene
  // el shared_secret de la época.
  bytes  ciphertext           = 4;
  // HMAC-SHA256(bootstrap_secrets[peer],
  //   "FIN" || epoch_id_be || from || peer || ciphertext).
  bytes  mac                  = 5;
}

message EstablishEphemeralSecretResponse {
  // `false` si MAC inválido o decap falló (no se mutó estado).
  bool   ok    = 1;
  // Descripción del fallo si `ok = false`.
  string error = 2;
}

message DeliveredMessage {
  .dkms.common.v1.NodeId origin    = 1;   // previous-hop ORR id (best-effort)
  .dkms.common.v1.NodeId destination = 2; // final destination = this ORR id
  bytes  payload                  = 3;
  map<string, string> app_header  = 4;
  int64  received_at_unix_ms      = 5;
  bool   pqc_decapsulated         = 6;
}

message OpenCircuitRequest {
  string circuit_id                       = 1;
  repeated .dkms.common.v1.NodeId path     = 2;  // ordered, includes self
  string pqc_suite                        = 3;  // e.g. "kyber1024+dilithium5"
  uint32 ttl_seconds                      = 4;
}

message OpenCircuitResponse {
  string circuit_id = 1;
  bytes  session_id = 2;
}

message CloseCircuitRequest { string circuit_id = 1; }

message GetCircuitRequest   { string circuit_id = 1; }

message ListCircuitsRequest { uint32 page_size = 1; }

message Circuit {
  string circuit_id                   = 1;
  repeated .dkms.common.v1.NodeId path = 2;
  CircuitState state                  = 3;
  int64  opened_at_unix_ms            = 4;
  int64  last_used_unix_ms            = 5;
  uint64 frames_relayed               = 6;
}

enum CircuitState {
  CIRCUIT_UNSPECIFIED = 0;
  OPENING             = 1;
  OPEN                = 2;
  CLOSING             = 3;
  CLOSED              = 4;
  FAILED              = 5;
}

message RelayFrame {
  string circuit_id = 1;
  uint32 hop_index  = 2;
  bytes  payload    = 3;   // already-encrypted onion layer
}
