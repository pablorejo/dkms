apiVersion: apps/v1
kind: Deployment
metadata:
  name: authz
  namespace: dkms-main-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: authz
  template:
    metadata:
      labels:
        app: authz
      annotations:
        karpenter.sh/do-not-disrupt: "true"
    spec:
      containers:
      - name: authz
        image: docker.io/pablopio/authz:v1
        imagePullPolicy: Always
        ports:
        - containerPort: 8081
        env:
        - name: PERSISTENCE_BACKEND
          value: "sqlalchemy"
        - name: DB_URL
          valueFrom:
            secretKeyRef:
              name: authz-secrets
              key: DB_URL
        - name: JWT_ALGORITHMS
          value: "HS256"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: authz-secrets
              key: JWT_SECRET
        - name: JWT_USER_CLAIM
          value: "uid"
        - name: AUTHZ_BIND_PORT
          value: "8081"
        - name: AUTHZ_SIM_ID_REGEX
          value: "/(?:api/sim|orch/api/sim|orch/web/simulations)/(?P<sim_id>\\d+)"
        # Endpoints administrativos (/orch/admin/...) no llevan sim_id en
        # el path. El cliente lo envía en esta cabecera y authz la extrae
        # para autorizar la petición contra la simulación correspondiente.
        - name: AUTHZ_SIM_ID_HEADER
          value: "X-Simulation-Id"
        - name: AUTHZ_USER_ONLY_PATHS
          value: "/orch/health,/orch/simulations,/orch/web/simulations"
        - name: AUTHZ_USER_ONLY_METHODS
          value: "GET,POST,HEAD"
        - name: AUTHZ_REQUIRE_ACTIVE
          value: "true"
---
apiVersion: v1
kind: Service
metadata:
  name: authz
  namespace: dkms-main-ns
spec:
  selector:
    app: authz
  ports:
  - name: http
    port: 8081
    targetPort: 8081
