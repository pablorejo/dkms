apiVersion: v1
kind: ServiceAccount
metadata:
  name: orchestator
  namespace: dkms-main-ns
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: orchestator-manager
rules:
  - apiGroups: [""]
    resources: ["namespaces", "pods", "services", "configmaps", "secrets", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: orchestator-manager
subjects:
  - kind: ServiceAccount
    name: orchestator
    namespace: dkms-main-ns
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: orchestator-manager
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestator
  namespace: dkms-main-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orchestator
  template:
    metadata:
      labels:
        app: orchestator
      annotations:
        karpenter.sh/do-not-disrupt: "true"
    spec:
      serviceAccountName: orchestator
      containers:
        - name: orchestator
          image: docker.io/pablopio/orchestator:v2
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /orch/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /orch/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          env:
            - name: PERSISTENCE_BACKEND
              value: "sqlalchemy"
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: authz-secrets
                  key: DB_URL
            - name: DOCKER_HUB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: authz-secrets
                  key: DOCKER_HUB_USERNAME
                  optional: true
            - name: DOCKER_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: authz-secrets
                  key: DOCKER_HUB_TOKEN
                  optional: true
            - name: DOCKER_HUB_EMAIL
              valueFrom:
                secretKeyRef:
                  name: authz-secrets
                  key: DOCKER_HUB_EMAIL
                  optional: true
            - name: DOCKER_HUB_SERVER
              valueFrom:
                secretKeyRef:
                  name: authz-secrets
                  key: DOCKER_HUB_SERVER
                  optional: true
            - name: ORCHESTATOR_HOST
              value: "0.0.0.0"
            - name: ORCHESTATOR_PORT
              value: "8080"
            - name: SDN_DISABLE_SLACK_VARS
              # iter-007/009: σ_k slack vars activadas → microlp phase-2 LP
              # reporta false-Infeasible 97-100% del tiempo, perdiendo el
              # bonus η_k del lex refinement. Forzar σ_k=0 (env=1) hace que
              # phase-1 sea más estricto, produce λ más ajustado, y mitiga
              # el impacto del bug microlp. Trade-off conocido: bajo
              # overload real (Σδ_k > capacity), unset esta env. Ver
              # CLAUDE.md "Active known issues / gotchas" entry de
              # 2026-05-23 sobre microlp phase-2 false-Infeasible.
              value: "1"
            - name: SDN_IMAGE
              value: "pablopio/sdn:v2"
            - name: DKMS_IMAGE
              value: "pablopio/dkms:v2"
            - name: ORR_IMAGE
              value: "pablopio/orr:v2"
            - name: QKC_IMAGE
              value: "pablopio/qkc:v2"
            - name: QUDITTO_IMAGE
              value: "pablopio/quditto:v2"
            - name: K8S_DKMS_RUST_SIDECARS
              value: "true"
            - name: K8S_IMAGE_PULL_SECRET
              value: "dockerhub-pull"
            - name: K8S_IMAGE_PULL_POLICY
              value: "Always"
            - name: K8S_INGRESS_ENABLED
              value: "true"
            - name: K8S_INGRESS_HOST
              value: "__INGRESS_HOST__"
            - name: K8S_INGRESS_CLASS
              value: "nginx"
            - name: K8S_INGRESS_AUTH_URL
              value: "http://authz.dkms-main-ns.svc.cluster.local:8081/authorize"
            - name: K8S_INGRESS_AUTH_HEADERS
              value: "X-User-Id,X-Simulation-Id"
---
apiVersion: v1
kind: Service
metadata:
  name: orchestator
  namespace: dkms-main-ns
spec:
  selector:
    app: orchestator
  ports:
    - name: http
      port: 8080
      targetPort: 8080
