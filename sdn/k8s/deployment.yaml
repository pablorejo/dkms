apiVersion: apps/v1
kind: Deployment
metadata:
  name: sdn
  labels: { app.kubernetes.io/name: sdn, app.kubernetes.io/part-of: dkms-rust }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: sdn } }
  template:
    metadata: { labels: { app.kubernetes.io/name: sdn } }
    spec:
      containers:
        - name: sdn
          image: ghcr.io/your-org/dkms-rust-sdn:latest
          ports:
            - { name: grpc,    containerPort: 50053 }
            - { name: http,    containerPort: 8081 }
            - { name: metrics, containerPort: 9102 }
          env:
            - { name: RUST_LOG,   value: "info,tonic=warn,h2=warn" }
            - { name: CONFIG_DIR, value: "/etc/sdn/config" }
          readinessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 5 }
          livenessProbe:  { httpGet: { path: /healthz, port: http }, periodSeconds: 10 }
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "2",    memory: "1Gi" }
