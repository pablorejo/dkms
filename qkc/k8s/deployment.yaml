apiVersion: apps/v1
kind: Deployment
metadata:
  name: qkc
  labels:
    app.kubernetes.io/name: qkc
    app.kubernetes.io/part-of: dkms-rust
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: qkc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qkc
    spec:
      containers:
        - name: qkc
          image: ghcr.io/your-org/dkms-rust-qkc:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 50051
            - name: hot
              containerPort: 7001
            - name: metrics
              containerPort: 9100
          env:
            - name: RUST_LOG
              value: "info,tonic=warn,h2=warn"
            - name: CONFIG_DIR
              value: "/etc/qkc/config"
          readinessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "2"
              memory: "1Gi"
