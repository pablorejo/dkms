# QKC default configuration.
# Per-deployment overrides go in config/local.toml or env vars (`QKC_*`).

node_id   = "node-1"
grpc_addr = "0.0.0.0:50051"
tcp_bind  = "0.0.0.0:7001"

sdn_url     = "http://127.0.0.1:50053"
quditto_url = "http://127.0.0.1:50055"

buffer_max_keys      = 8192
key_size_bits        = 256
default_refill_rate  = 1000
metrics_addr         = "0.0.0.0:9100"

# Peer TCP endpoints (NodeId -> host:port). Populated by SDN at runtime;
# anything pre-seeded here is used until SDN catches up.
[peer_tcp]
# node-2 = "10.0.0.2:7001"
# node-3 = "10.0.0.3:7001"
