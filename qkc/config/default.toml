# Config de desarrollo del QKC (scripts/run-qkc.sh la pasa con --config).
#
# A diferencia de los otros módulos, el QKC NO usa CONFIG_DIR/env: carga
# exactamente el fichero de `qkc --config <path>`. El conjunto completo de
# campos vive en qkc/src/config.rs; en despliegue este TOML lo genera
# docker/render_config.py a partir de un node.yml (docker/README.md).

qkc_id       = 1
peer_listen  = "0.0.0.0:20000"     # frames de otros QKCs
local_listen = "127.0.0.1:20001"   # frames del ORR co-localizado
admin_http   = "0.0.0.0:20002"     # push de forwarding-table, /healthz, /stats

# Anuncio a la SDN (opcional: sin él, alta manual en la SDN).
# sdn_url      = "http://127.0.0.1:19002"
# advertise_ip = "127.0.0.1"

# Un [[links]] por enlace con un vecino directo. Ejemplo PQC:
# [[links]]
# neighbor_id        = 2
# neighbor_peer_addr = "127.0.0.1:20100"
# key_size_bits      = 256
# link_type          = "pqc"
# pqc_suite          = "ml-kem-768"
# link_psk           = "<base64>"     # raíz de pqc_auth/frame_auth (ambos lados)
# frame_auth         = "require"
#
# Y uno QKD contra un KME/quditto (el render de despliegue emite https):
# [[links]]
# neighbor_id        = 3
# neighbor_peer_addr = "127.0.0.1:20200"
# key_size_bits      = 256
# link_type          = "qkd"
# quditto_url        = "http://127.0.0.1:20010"
