[package]
name        = "common"
version     = { workspace = true }
edition     = { workspace = true }
license     = { workspace = true }
description = "Shared types, IPC helpers, config, logging, and protobuf-generated code for dkms_rust"

[lib]
path = "src/lib.rs"

[dependencies]
wire               = { path = "../wire" }

tokio              = { workspace = true }
tokio-util         = { workspace = true }
futures            = { workspace = true }
async-trait        = { workspace = true }
bytes              = { workspace = true }
tonic              = { workspace = true }
prost              = { workspace = true }
prost-types        = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
rmp-serde          = { workspace = true }
bincode            = { workspace = true }
toml               = { workspace = true }
config             = { workspace = true }
dotenvy            = { workspace = true }
anyhow             = { workspace = true }
thiserror          = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
prometheus         = { workspace = true }
rustls             = { workspace = true }
tokio-rustls       = { workspace = true }
rustls-pemfile     = { workspace = true }
webpki-roots       = { workspace = true }
reqwest            = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2               = { workspace = true }
hmac               = "0.12"
hkdf               = { workspace = true }
chacha20poly1305   = { workspace = true }
aes-gcm            = { workspace = true }
ml-kem             = { workspace = true }
ml-dsa             = { version = "0.1.1", features = ["pkcs8"] }
webpki             = { package = "rustls-webpki", version = "0.103", features = ["aws-lc-rs", "aws-lc-rs-unstable"] }
zeroize            = "1.8"
ring               = { workspace = true }
base64             = { workspace = true }
hex                = { workspace = true }
rand               = { workspace = true }
chrono             = { workspace = true }
humantime          = { workspace = true }
dashmap            = { workspace = true }
parking_lot        = { workspace = true }
arc-swap           = { workspace = true }
uuid               = { workspace = true }

[build-dependencies]
tonic-build = { workspace = true }
