# Deployment of a QKC. Copy your node.yml next to this file and:
#   docker compose -f qkc.yml pull && docker compose -f qkc.yml up -d
#   docker compose -f qkc.yml logs -f
services:
  qkc:
    image: ${IMAGE_PREFIX:-ORG}/qkc:${TAG:-latest}
    network_mode: host                 # uses the machine's network (no port mapping)
    restart: unless-stopped
    volumes:
      - ./node.yml:/config/node.yml:ro
      # certs: needed with control_tls (default ON: announcing to an SDN with mTLS)
      # and to dial an https KME/quditto: qkc-<n>.crt/.key + net-ca.crt.
      - ./certs:/config/certs:ro
