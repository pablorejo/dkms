# Despliegue de un quditto — simulador de enlace QKD.
#
# Solo hace falta si NO tienes hardware QKD y quieres enlaces `type: qkd` de
# todas formas. Un quditto sirve a UN enlace: los QKC de sus dos extremos
# apuntan al mismo `kme_url`, y así ambos obtienen el mismo material.
#
#   docker compose -f quditto.yml pull && docker compose -f quditto.yml up -d
#   docker compose -f quditto.yml logs -f
#
# Comprobación rápida (puerto por defecto 20010; mTLS por defecto, así que
# hace falta el cert de cliente — con `tls: false` en node.yml vale http):
#   curl -s --cert certs/qkc-1.crt --key certs/qkc-1.key --cacert certs/net-ca.crt \
#        https://localhost:20010/api/v1/keys/1/status
services:
  quditto:
    image: ${IMAGE_PREFIX:-ORG}/quditto:${TAG:-latest}
    network_mode: host                 # usa la red de la máquina (sin mapear puertos)
    restart: unless-stopped
    volumes:
      - ./node.yml:/config/node.yml:ro
      # certs: el ETSI-014 sirve mTLS POR DEFECTO (por él viajan los pads
      # OTP): quditto.crt/.key + net-ca.crt de gen-certs.sh. Solo sobra con
      # `tls: false` en node.yml (QKC co-localizado).
      - ./certs:/config/certs:ro
