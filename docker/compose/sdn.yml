# Deployment of the central SDN. The SDN carries NO topology: it infers it from
# the modules' announcements (POST /register/{qkc,orr,dkms}); its node.yml is only
# its listen addresses and timers (see examples/node.sdn.yml).
services:
  sdn:
    image: ${IMAGE_PREFIX:-ORG}/sdn:${TAG:-latest}
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./node.yml:/config/node.yml:ro
      # certs: needed with control_tls (default ON) in its node.yml (mTLS on the
      # admin HTTP/gRPC — recommended on multi-host): sdn.crt/.key + net-ca.crt.
      - ./certs:/config/certs:ro
