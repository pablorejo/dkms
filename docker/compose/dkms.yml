# Deployment of a DKMS. Copy your node.yml + the certs/ folder (see gen-certs.sh)
# next to this file.
services:
  dkms:
    image: ${IMAGE_PREFIX:-ORG}/dkms:${TAG:-latest}
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./node.yml:/config/node.yml:ro
      - ./certs:/config/certs:ro          # net-ca.crt + sae-ca.crt + <node_id>.crt + <node_id>.key
