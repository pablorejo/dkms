# "Whole site": QKC + ORR + DKMS of ONE node on the SAME machine.
# Since each role uses different ports by default (20000-20009), they coexist
# with network_mode: host without colliding. Place next to this file:
#   node.qkc.yml  node.orr.yml  node.dkms.yml  and  certs/
# In the orr/dkms node.yml leave qkc_addr/orr_addr at 127.0.0.1 (co-located).
services:
  qkc:
    image: ${IMAGE_PREFIX:-ORG}/qkc:${TAG:-latest}
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./node.qkc.yml:/config/node.yml:ro
      - ./certs:/config/certs:ro
  orr:
    image: ${IMAGE_PREFIX:-ORG}/orr:${TAG:-latest}
    network_mode: host
    restart: unless-stopped
    # certs: its gRPC runs with mTLS by default (orr_<n>.crt/.key + net-ca.crt).
    volumes:
      - ./node.orr.yml:/config/node.yml:ro
      - ./certs:/config/certs:ro
  dkms:
    image: ${IMAGE_PREFIX:-ORG}/dkms:${TAG:-latest}
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./node.dkms.yml:/config/node.yml:ro
      - ./certs:/config/certs:ro
