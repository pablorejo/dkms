# Deployment of an ORR. Copy your node.yml next to this file.
services:
  orr:
    image: ${IMAGE_PREFIX:-ORG}/orr:${TAG:-latest}
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./node.yml:/config/node.yml:ro
      # Node certificate of the ORR + net-ca.crt: its gRPC runs with mTLS by
      # default (gen-certs.sh <orr_id> <ip> ./certs).
      - ./certs:/config/certs:ro
