# Despliegue de un ORR. Copia tu node.yml junto a este fichero.
services:
  orr:
    image: ${IMAGE_PREFIX:-ORG}/orr:${TAG:-latest}
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./node.yml:/config/node.yml:ro
      # Certificado de nodo del ORR + net-ca.crt: su gRPC va con mTLS por
      # defecto (gen-certs.sh <orr_id> <ip> ./certs).
      - ./certs:/config/certs:ro
