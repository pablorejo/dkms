# node.yml for a DKMS.
node_id: "dkms-1"

# IP of THIS machine, reachable by the other DKMSs: the SDN hands it out as my
# ETSI-020 endpoint (20006), over which their ACKs come back (20009 = legacy, off).
advertise_ip: "10.0.0.11"      # must match the certificate's SAN (see gen-certs.sh)

# Where ITS ORR is (localhost if co-located; IP if on another machine).
orr_addr: "127.0.0.1:20003"
# orr_tls: true                # talks https:// to the ORR with the node cert (default);
                               # false ONLY with grpc_tls: false in the ORR

sdn_endpoint: "https://10.0.0.100:19000"   # SDN with mTLS by default (control_tls)
orr_id: "orr_1"                # id of the ORR I hang off. The SDN places me in
                               # the graph by it; its address is no use as an id.
# sdn_announce_secs: 30        # how often I re-announce (it is my heartbeat)

# DKMS peers (one entry per every other DKMS it exchanges keys with).
peers:
  dkms-2:
    endpoint: "10.0.0.12"    # IP (or IP:port) of the peer DKMS; default peer port 20006
    orr_id: "orr_2"          # id of that peer's ORR (transport over ORR)

# security_level: qkd_prefer   # strict_qkd | qkd_prefer | no_worry
# fill_rate: 0                 # fill floor in keys/s (0 = only what the SDN allocates)

# Certificates: mount net-ca.crt + sae-ca.crt + <node_id>.crt + <node_id>.key in
# /config/certs (see docker/gen-certs.sh and docs/SECURITY.md §2: net-ca signs
# nodes, sae-ca signs SAEs). Path configurable with certs_dir.
# certs_dir: /config/certs

# SAEs that THIS node serves. Not optional: the DKMS authorises every ETSI-014
# request against this list (fail-closed) and announces it to the SDN. Without
# it, every SAE request gets 404 UnknownSae.
sae_bindings:
  sae_1: dkms-1
# sae_authorization: true      # false ONLY if the SAE->DKMS membership is
                               # purely dynamic via the SDN (not recommended)
