# node.yml for a QKC — the only thing the institution edits.
# Without real QKD: use "pqc" links (the two QKCs derive the keys with ML-KEM).
qkc_id: 1

# The SDN learns about this node and its links on its own: there is nowhere to
# register it. Omit sdn_url only if you prefer to manage the topology by hand.
sdn_url: "10.0.0.100"          # HTTP admin of the SDN; default port 19002.
                               # Without a scheme it comes out https:// (control_tls,
                               # default on): needs qkc-<id>.crt/.key + net-ca.crt in
                               # certs_dir. `control_tls: false` = in the clear.
advertise_ip: "10.0.0.11"      # IP through which the SDN can reach THIS QKC
# sdn_announce_secs: 30        # how often I re-announce (it is also the heartbeat)

# key_size_bits: 256          # OTP key bits; MUST match at both ends

# Who you have fibre with. It is the only topology a QKC declares: the rest
# (where everyone is, which ORR hangs off whom) is assembled by the SDN.
links:
  - neighbor_id: 2
    # OPTIONAL on a pqc link if there is an sdn_url: the address does not travel
    # in the announcement —the SDN already knows it, every QKC announces its
    # own— and comes back in the peer list. Leave it out and the link is built
    # when the SDN answers; set it and it is built at boot, without depending
    # on the SDN. A qkd link requires it: the SDN does not create qkd links.
    # neighbor_addr: "10.0.0.12"   # IP (or IP:port); default peer port 20000
    type: pqc                    # pqc = ML-KEM between neighbours | qkd = KME over ETSI-014
    # --- if type: qkd (KME: real hardware, or a quditto if you have none) ---
    # kme_url: "https://mi-nodo-qkd:443"   # or "http://10.0.0.50:20010" for a quditto
    # Physical model of the link. The QKC does not use it: it passes it to the
    # SDN, which sizes the edge with r0·10^(−alpha·d/10). With hardware these
    # are your fibre's figures; with a quditto, the same ones you configured on it.
    # pqc links carry no capacity, so here they are superfluous.
    # r0: 2000
    # alpha: 0.2
    # distance_km: 5
    # --- optional PQC settings (sensible defaults) ---
    # pqc_suite: ml-kem-768
    # pqc_rekey_keys: 1000       # rotates the secret every N keys
    # pqc_rekey_secs: 3600       # ...or every T seconds (whichever comes first)
    # pqc_rekey_lookahead: 2

# The SDN pushes the forwarding table to it automatically; it is not configured here.
# ports:                        # override only if several QKCs share a host
#   peer: 20000
#   local: 20001
#   admin: 20002
