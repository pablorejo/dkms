# node.yml para un QKC — lo único que edita la institución.
# Sin QKD real: usa enlaces "pqc" (los dos QKC derivan las claves con ML-KEM).
qkc_id: 1

# La SDN se entera sola de este nodo y de sus enlaces: no hay que darlo de alta
# en ningún sitio. Omite sdn_url solo si prefieres gestionar la topología a mano.
sdn_url: "10.0.0.100"          # HTTP admin de la SDN; puerto por defecto 19002
advertise_ip: "10.0.0.11"      # IP por la que la SDN puede alcanzar a ESTE QKC
# sdn_announce_secs: 30        # cada cuánto reanuncio (es también el heartbeat)

# key_size_bits: 256          # bits de clave OTP; DEBE coincidir en ambos extremos

links:
  - neighbor_id: 2
    neighbor_addr: "10.0.0.12"   # IP (o IP:puerto) del QKC vecino; puerto peer por defecto 20000
    type: pqc                    # pqc = ML-KEM entre vecinos | qkd = KME por ETSI-014
    # --- si type: qkd (KME: hardware real, o un quditto si no lo tienes) ---
    # kme_url: "https://mi-nodo-qkd:443"   # o "http://10.0.0.50:20010" para un quditto
    # Modelo físico del enlace. El QKC no lo usa: se lo comunica a la SDN, que
    # dimensiona la arista con r0·10^(−alpha·d/10). Con hardware son los datos
    # de tu fibra; con un quditto, los mismos que le configuraste a él.
    # Los enlaces pqc no llevan capacidad, así que aquí sobran.
    # r0: 2000
    # alpha: 0.2
    # distance_km: 5
    # --- ajustes PQC opcionales (defaults sensatos) ---
    # pqc_suite: ml-kem-768
    # pqc_rekey_keys: 1000       # rota el secreto cada N claves
    # pqc_rekey_secs: 3600       # ...o cada T segundos (lo que llegue primero)
    # pqc_rekey_lookahead: 2

# La SDN le empuja la tabla de forwarding automáticamente; no se configura aquí.
# ports:                        # override solo si varios QKC comparten host
#   peer: 20000
#   local: 20001
#   admin: 20002
