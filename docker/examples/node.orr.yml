# node.yml para un ORR.
orr_id: "orr_1"
qkc_id: 1
# El DKMS al que sirve (identidad del SAN de su cert): es la reja de
# `SendMessage`/`StreamDeliveries`. Sin esto el renderer avisa y el ORR
# acepta cualquier cert de la net-ca en su plano de aplicación.
served_dkms: ["dkms-1"]

# Dónde está SU QKC. Si el ORR y el QKC están en la MISMA máquina, deja
# localhost; si están en máquinas distintas, pon la IP del QKC.
qkc_addr: "127.0.0.1:20001"        # local_listen del QKC (puerto 20001)

sdn_url: "https://10.0.0.100:19000" # gRPC de la SDN central (mTLS por defecto;
                                    # http:// solo con control_tls: false en todos)
advertise_ip: "10.0.0.11"          # IP por la que la SDN alcanza a ESTE ORR;
                                   # con ella el ORR se da de alta solo
# sdn_announce_secs: 30            # cada cuánto reanuncia (es su heartbeat)

# Peers ORR (una entrada por cada otro ORR de la red).
peers:                             # orr_id -> qkc_id
  orr_2: 2
peer_grpc_addrs:                   # orr_id -> URL gRPC del ORR peer (puerto 20003)
  orr_2: "http://10.0.0.12:20003"

# default_max_hops: 0              # 0 = relay (default): el DKMS ya sella e2e.
                                   # 1 / >=2 / -1 añaden cebolla ORR<->ORR encima.

# El gRPC de este ORR (su DKMS y los ORR de fuera) va con mTLS POR DEFECTO:
# necesita certs/<orr_id>.crt/.key + net-ca.crt (gen-certs.sh orr_1 <ip>
# ./certs, ML-DSA-65) en certs_dir. Sin ellos no arranca, y lo dice.
# grpc_tls: true
# certs_dir: "/config/certs"       # donde el compose monta ./certs
