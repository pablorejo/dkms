# node.yml for the central SDN — maintained by the operator.
#
# **It carries no topology.** The SDN boots with an empty graph and builds it
# from what each module tells it when it registers: the QKC says who it is and
# who its neighbours are, the ORR which QKC it hangs off, the DKMS which ORR
# and which SAEs it serves. Adding an institution: no change here, no restart.
#
# For that to happen, each module needs its `sdn_url`/`sdn_endpoint` and its
# `advertise_ip` — see the example node.yml of each role.

# listen_ip: "0.0.0.0"
# ports:
#   grpc: 19000          # ORR and DKMS
#   http: 19002          # module registration + admin
#   metrics: 19010

# mcf_period_ms: 5000    # how often the rates are recomputed; a topology
#                        # change is picked up by the next tick

# presence_ttl_secs: 90  # a module that stops announcing itself for longer than
#                        # this leaves the topology, and its links with it. It
#                        # must exceed the modules' sdn_announce_secs (30 by
#                        # default): that is 3 lost announcements. 0 disables it.
