# node.yml for a quditto — QKD link simulator.
#
# It serves ETSI-014 to the QKCs of ONE link, generating random keys at
#
#     R(d) = r0 · 10^(−alpha·d/10)   keys/s
#
# You only need it if you have no QKD hardware. The QKCs at both ends point at
# this same `kme_url`, which is why both obtain the same material.
# The same r0/alpha/distance_km are declared in the `node.yml` of those two
# QKCs, which are the ones that pass them to the SDN for its capacity model:
# if they do not match, the SDN allocates flow over a capacity the link does not deliver.

r0: 2000                   # base rate in keys/s at distance 0
alpha: 0.2                 # fibre attenuation in dB/km
distance_km: 5             # length of the simulated link

# max_buffer: 8192         # keys in the buffer; when full, new ticks are discarded
# key_size_bits: 256       # MUST match the key_size_bits of the QKCs
# listen_ip: "0.0.0.0"
# ports:
#   http: 20010

# The ETSI-014 serves mTLS BY DEFAULT (the OTP pads travel over it): certs from
# gen-certs.sh in ./certs (quditto.crt/.key + net-ca.crt; `cert_name` for another
# name) and the QKCs dial https with their node cert. `tls: false` leaves it in
# the clear — ONLY if the consuming QKC runs on this same machine.
# tls: true
# cert_name: quditto
