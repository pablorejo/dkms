[package]
name        = "orr"
version     = { workspace = true }
edition     = { workspace = true }
license     = { workspace = true }
description = "Onion Routing Router — relays DKMS payloads through the QKC substrate"

[[bin]]
name = "orr"
path = "src/main.rs"

[[bin]]
name = "orr-test-client"
path = "src/bin/test_client.rs"

[lib]
path = "src/lib.rs"

[dependencies]
common             = { workspace = true }
wire               = { path = "../wire" }

tokio              = { workspace = true }
tokio-stream       = { workspace = true }
futures            = { workspace = true }
async-trait        = { workspace = true }
bytes              = { workspace = true }
tonic              = { workspace = true }
prost              = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
rmp-serde          = { workspace = true }
# Solo para el anuncio a la SDN (HTTP admin). El resto del plano de control
# del ORR va por gRPC — ver sdn_client.rs.
reqwest            = { version = "0.12", default-features = false, features = ["json"] }
clap               = { workspace = true }
dotenvy            = { workspace = true }
anyhow             = { workspace = true }
thiserror          = { workspace = true }
tracing            = { workspace = true }
prometheus         = { workspace = true }
dashmap            = { workspace = true }
parking_lot        = { workspace = true }
uuid               = { workspace = true }
chrono             = { workspace = true }
rand               = { workspace = true }
base64             = { workspace = true }
hkdf               = { workspace = true }
sha2               = { workspace = true }
hmac               = "0.12"
subtle             = "2.6"
zeroize            = { version = "1.8", features = ["zeroize_derive"] }
serde_bytes        = "0.11"
