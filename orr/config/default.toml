# Configuración por defecto del ORR.
#
# Overrides en orden:
#   1. config/default.toml  (este fichero)
#   2. config/local.toml    (gitignored, dev only)
#   3. variables de entorno con prefijo `ORR_`, separador `__`
#      (ej. `ORR_QKC_LOCAL_ADDR=127.0.0.1:7100`).

orr_id          = "ORR_1"
qkc_id          = 1
qkc_local_addr  = "127.0.0.1:7100"
grpc_addr       = "0.0.0.0:50052"
sdn_url         = "http://127.0.0.1:50053"
metrics_addr    = "0.0.0.0:9101"

# 0 = passthrough (sin cebolla). 1 = PQC E2E. -1 = onion full. >=2 = onion truncada.
default_max_hops = 0

# El gRPC de este ORR (lo que le habla su DKMS y lo que le hablan los ORR
# pares) va con mTLS POR DEFECTO: por él viaja el material de transporte.
# Exige la identidad de nodo en [tls] (al final del fichero, porque es una
# tabla); sin ella el ORR no arranca y dice qué le falta. Para ir en claro
# —sólo si DKMS y ORR comparten máquina o red interna de confianza— hay que
# escribirlo: `grpc_tls = false` aquí y `orr_tls = false` en el DKMS.
# grpc_tls = true

# Suite ML-KEM del bootstrap ORR↔ORR: ml-kem-512 / ml-kem-768 / ml-kem-1024.
# (El nombre viejo estilo liboqs "kyber1024+dilithium5" ya no existe y el
# resolvedor lo rechaza.)
default_pqc_suite       = "ml-kem-768"
deliver_queue_capacity  = 4096

# Mapa lógico orr_id -> qkc_id. La SDN puede refrescarlo en runtime.
[peers]
# ORR_2 = 2
# ORR_3 = 3

# Claves públicas ML-KEM de los peers (base64). Necesarias para los
# modos onion (max_hops != 0). Cada ORR las genera al boot y debe
# distribuirlas por SDN o config. Mientras la SDN no esté lista,
# colocarlas a mano aquí.
[peer_pubkeys]
# ORR_2 = "AAA...base64..."
# ORR_3 = "BBB...base64..."

# Identidad de nodo (CA de red): docker/gen-certs.sh ORR_1 <ip> ./certs
# [tls]
# cert_path        = "certs/ORR_1.crt"
# key_path         = "certs/ORR_1.key"
# control_plane_ca = "certs/net-ca.crt"
