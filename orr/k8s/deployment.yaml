apiVersion: apps/v1
kind: Deployment
metadata:
  name: orr
  labels:
    app.kubernetes.io/name: orr
    app.kubernetes.io/part-of: dkms-rust
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: orr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orr
    spec:
      containers:
        - name: orr
          image: ghcr.io/your-org/dkms-rust-orr:latest
          ports:
            - { name: grpc,    containerPort: 50052 }
            - { name: metrics, containerPort: 9101 }
          env:
            - { name: RUST_LOG,   value: "info,tonic=warn,h2=warn" }
            - { name: CONFIG_DIR, value: "/etc/orr/config" }
          readinessProbe: { tcpSocket: { port: 50052 }, initialDelaySeconds: 2, periodSeconds: 5 }
          livenessProbe:  { tcpSocket: { port: 50052 }, initialDelaySeconds: 10, periodSeconds: 10 }
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "1",    memory: "512Mi" }
