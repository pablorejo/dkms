apiVersion: apps/v1
kind: Deployment
metadata:
  name: quditto
  labels: { app.kubernetes.io/name: quditto, app.kubernetes.io/part-of: dkms-rust }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: quditto } }
  template:
    metadata: { labels: { app.kubernetes.io/name: quditto } }
    spec:
      containers:
        - name: quditto
          image: ghcr.io/your-org/dkms-rust-quditto:latest
          ports:
            - { name: grpc,    containerPort: 50055 }
            - { name: metrics, containerPort: 9104 }
          env:
            - { name: RUST_LOG,   value: "info,tonic=warn,h2=warn" }
            - { name: CONFIG_DIR, value: "/etc/quditto/config" }
          readinessProbe: { tcpSocket: { port: 50055 }, initialDelaySeconds: 2, periodSeconds: 5 }
          livenessProbe:  { tcpSocket: { port: 50055 }, initialDelaySeconds: 10, periodSeconds: 10 }
          resources:
            requests: { cpu: "50m",  memory: "64Mi" }
            limits:   { cpu: "500m", memory: "256Mi" }
