# ORR de HOJA-33. Co-localizado con qkc-33 (local_listen 7133).
orr_id          = "orr_33"
qkc_id          = 33
qkc_local_addr  = "127.0.0.1:7133"
grpc_addr       = "0.0.0.0:50533"
sdn_url         = "http://127.0.0.1:50053"
metrics_addr    = "0.0.0.0:9533"

default_max_hops = 0
deliver_queue_capacity = 65536

# El gRPC de este ORR va con mTLS por defecto (grpc_tls = true): lo que le
# habla su DKMS y lo que le hablan los otros ORR. Identidad de nodo de
# gen-tls.sh (rutas relativas a la raíz del repo, desde donde arranca
# start-orrs.sh). Los peer_grpc_addrs de abajo dicen http:// y el ORR los sube
# a https:// él solo.
[tls]
cert_path        = "scripts/demo-star/tls/orr_33.crt"
key_path         = "scripts/demo-star/tls/orr_33.key"
control_plane_ca = "scripts/demo-star/tls/net-ca.crt"

[peers]
orr_11 = 11
orr_22 = 22
orr_44 = 44

[peer_grpc_addrs]
orr_11 = "http://127.0.0.1:50511"
orr_22 = "http://127.0.0.1:50522"
orr_44 = "http://127.0.0.1:50544"

[peer_pubkeys]
