[workspace]
resolver = "2"
members = [
    "common",
    "etsi",
    "wire",
    "qkc",
    "orr",
    "sdn",
    "dkms",
    "quditto",
]

# Each crate can also be built/published independently:
#   cargo build -p qkc     # only QKC binary
#   cargo build -p sdn     # only SDN binary
#   cargo build --release  # everything

[workspace.package]
version      = "0.1.0"
edition      = "2021"
rust-version = "1.78"
license      = "Apache-2.0"
authors      = ["Pablo Pío Rejo Iglesias"]
repository   = "https://github.com/pabloprejo/dkms_rust"
readme       = "README.md"

# ─── Shared dependency versions ──────────────────────────────────────────
# Crates pull these in via `dep.workspace = true` so versions stay aligned.
[workspace.dependencies]
# Async runtime
tokio        = { version = "1.40", features = ["full"] }
tokio-util   = { version = "0.7",  features = ["codec"] }
tokio-stream = { version = "0.1",  features = ["net"] }
futures      = "0.3"
async-trait = "0.1"
bytes       = "1.7"

# gRPC / protobuf (control plane IPC)
tonic       = { version = "0.12", features = ["tls", "transport"] }
tonic-build = "0.12"
prost       = "0.13"
prost-types = "0.13"

# HTTP server (DKMS ETSI endpoints, SDN admin API)
axum       = { version = "0.7",  features = ["macros", "http2"] }
hyper      = { version = "1.4",  features = ["full"] }
hyper-util = { version = "0.1",  features = ["full"] }
tower      = "0.5"
tower-http = { version = "0.6",  features = ["trace", "cors", "timeout"] }

# Serialization
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmp-serde  = "1.3"        # msgpack — used in QKC binary wire header
bincode    = "1.3"
toml       = "0.8"

# Config + CLI
clap   = { version = "4.5", features = ["derive", "env"] }
config = { version = "0.14", features = ["toml"] }
dotenvy = "0.15"

# Errors
anyhow    = "1.0"
thiserror = "1.0"

# Logging / tracing / metrics
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
tracing-opentelemetry = "0.27"
opentelemetry      = "0.26"
prometheus         = "0.13"

# TLS / mTLS
rustls       = "0.23"
tokio-rustls = "0.26"
rustls-pemfile = "2"
webpki-roots = "0.26"

# Crypto
sha2   = "0.10"
hkdf   = "0.12"
chacha20poly1305 = "0.10"
aes-gcm = "0.10"
ring   = "0.17"
base64 = "0.22"
hex    = "0.4"
rand   = { version = "0.8", features = ["small_rng"] }
rand_chacha = "0.3"

# Post-quantum (NIST FIPS 203 — pure Rust, no liboqs)
ml-kem = "0.2"

# Lock-free queues
crossbeam-queue = "0.3"

# Time
chrono = { version = "0.4", features = ["serde"] }
humantime = "2.1"

# Graph (SDN topology + MCF routing)
petgraph = "0.6"

# Concurrency primitives
dashmap = "6.1"
parking_lot = "0.12"
arc-swap = "1.7"

# UUID / IDs
uuid = { version = "1.10", features = ["v4", "serde"] }

# In-workspace deps
common = { path = "common" }

# ─── Release profile ─────────────────────────────────────────────────────
[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = true
panic         = "abort"

[profile.dev]
opt-level = 1

# Build .proto generated code with optimizations even in dev so
# tonic/prost stay fast during local iteration.
[profile.dev.package.prost-build]
opt-level = 3
[profile.dev.package.tonic-build]
opt-level = 3
