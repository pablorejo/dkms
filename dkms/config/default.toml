# Config de desarrollo del DKMS (scripts/run-dkms.sh, vía CONFIG_DIR).
#
# Overrides en orden: default.toml <- local.toml (gitignored) <- env `DKMS_`
# (separador `__`; un override anidado SE FUNDE con la sección del fichero).
# El conjunto completo de campos vive en dkms/src/config.rs; en despliegue
# este TOML lo genera docker/render_config.py desde un node.yml.

node_id = "dkms-1"

[listen]
sae_addr     = "0.0.0.0:20005"
peer_addr    = "0.0.0.0:20006"
# gRPC DkmsControl: plano de operador SIN auth. El RPC `Drain` cierra admisión
# y BORRA pending + todos los buffers de transporte con una sola llamada, así
# que por defecto bindea a localhost (docs/SECURITY.md §Fase 7 y §1.2). Si un
# orquestador remoto lo necesita, ponlo a una IP interna y firewalléalo —
# nunca expuesto entre instituciones.
grpc_addr    = "127.0.0.1:20007"
# /metrics: sin auth y responde a CUALQUIER path. Mantenlo en la red interna.
metrics_addr = "0.0.0.0:20008"
# Confiar en el header `ssl-client-cert` (PEM sin verificar) por delante del
# cert mTLS local. Solo para despliegues detrás de nginx-ingress que termina
# el mTLS en el borde y donde estos puertos NO son accesibles de otro modo.
# trust_proxy_client_cert_header = false

[tls]
# Dos raíces separadas (docs/SECURITY.md §2): SAEs firmados por sae-ca;
# peers DKMS y control plane (SDN/QKC/ORR) por net-ca. Genera el juego con:
#   docker/gen-certs.sh dkms-1 127.0.0.1 ./certs   (ML-DSA-65 por defecto)
cert_path        = "certs/dkms-1.crt"
key_path         = "certs/dkms-1.key"
sae_client_ca    = "certs/sae-ca.crt"
peer_dkms_ca     = "certs/net-ca.crt"
control_plane_ca = "certs/net-ca.crt"

[southbound]
# gRPC de la SDN (la registración va por su HTTP admin, sdn_http_url).
sdn_endpoint        = "http://127.0.0.1:19000"
connect_timeout_ms  = 1500
rpc_timeout_ms      = 3000
# ORR de este nodo. `orr_tls` (default true) sube http->https y presenta el
# cert de nodo; `orr_tls = false` SOLO si DKMS y ORR comparten máquina.
# orr_endpoint = "http://127.0.0.1:20003"
# orr_id       = "orr_1"

# [peers.dkms-2]
# endpoint = "https://10.0.0.2:20006"

[buffer]
capacity_per_peer    = 4096
refill_low_watermark = 1024
refill_batch         = 256

[pending]
default_ttl_secs    = 86400
sweep_interval_secs = 30

[sae]
default_rate_keys_per_sec = 100
default_burst_keys        = 400
token_unit_bytes          = 32
# Exigir que el SAE autenticado sea uno de los declarados en [sae_bindings]
# como servidos por este DKMS. `false` solo si la pertenencia es dinámica
# vía SDN y no se declara localmente.
# enforce_authorization     = true

[sae_binding]
ttl_secs    = 60
max_entries = 16384

[request]
peer_send_timeout_ms  = 1500
ack_wait_timeout_ms   = 2500
max_concurrent_peers  = 32
