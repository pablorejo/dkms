apiVersion: v1
kind: Service
metadata:
  name: dkms
  labels: { app.kubernetes.io/name: dkms, app.kubernetes.io/part-of: dkms-rust }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: dkms }
  ports:
    - { name: http,    port: 8080,  targetPort: http }
    - { name: grpc,    port: 50054, targetPort: grpc }
    - { name: metrics, port: 9103,  targetPort: metrics }
