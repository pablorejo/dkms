apiVersion: apps/v1
kind: Deployment
metadata:
  name: dkms
  labels: { app.kubernetes.io/name: dkms, app.kubernetes.io/part-of: dkms-rust }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: dkms } }
  template:
    metadata: { labels: { app.kubernetes.io/name: dkms } }
    spec:
      containers:
        - name: dkms
          image: ghcr.io/your-org/dkms-rust-dkms:latest
          ports:
            - { name: http,    containerPort: 8080 }
            - { name: grpc,    containerPort: 50054 }
            - { name: metrics, containerPort: 9103 }
          env:
            - { name: RUST_LOG,   value: "info,tonic=warn,h2=warn" }
            - { name: CONFIG_DIR, value: "/etc/dkms/config" }
          readinessProbe: { httpGet: { path: /readyz, port: http }, periodSeconds: 5 }
          livenessProbe:  { httpGet: { path: /healthz, port: http }, periodSeconds: 10 }
          resources:
            requests: { cpu: "200m", memory: "256Mi" }
            limits:   { cpu: "4",    memory: "2Gi" }
